<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NON stockists map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0c0c0c; }
  #map { position: absolute; inset: 0; background: #0c0c0c; }
  /* OSM tiles desaturated and inverted to sit in the ink palette */
  .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.92) contrast(1.05); }
  .leaflet-container { background: #0c0c0c; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .leaflet-control-attribution {
    background: rgba(12,12,12,.72) !important; color: #8a8a87 !important;
    font-size: 9.5px !important; letter-spacing: .04em;
  }
  .leaflet-control-attribution a { color: #b4b4b1 !important; }
  .leaflet-bar { border: 1px solid #333331 !important; }
  .leaflet-bar a {
    background: #141412 !important; color: #f2f0ea !important;
    border-bottom: 1px solid #333331 !important;
  }
  .leaflet-bar a:hover { background: #1f1f1d !important; }
  .pin { width: 10px; height: 10px; border-radius: 50%; background: #f2f0ea; box-shadow: 0 0 0 4px rgba(242,240,234,.22); }
  .pin.hq { background: #ffffff; box-shadow: 0 0 0 5px rgba(255,255,255,.32); }
  .leaflet-popup-content-wrapper {
    background: #0c0c0c; color: #f2f0ea; border: 1px solid #333331;
    border-radius: 0; box-shadow: none;
  }
  .leaflet-popup-content { margin: 12px 14px; font-size: 12.5px; line-height: 1.45; }
  .leaflet-popup-content b { font-weight: 500; font-size: 14px; }
  .leaflet-popup-content span { color: #8a8a87; }
  .leaflet-popup-tip { background: #0c0c0c; border: 1px solid #333331; }
  .leaflet-popup-close-button { color: #8a8a87 !important; }
  #empty {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(12,12,12,.82); color: #8a8a87;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; letter-spacing: .04em;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="empty">Nothing listed there yet</div>
<script>
  var map = L.map('map', { zoomControl: true, scrollWheelZoom: false, attributionControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  var pins = L.layerGroup().addTo(map);
  var empty = document.getElementById('empty');

  // Melbourne until the page tells us otherwise.
  map.setView([-37.84, 144.99], 11);

  function draw(venues) {
    pins.clearLayers();
    var bounds = [];
    (venues || []).forEach(function (v) {
      if (typeof v.lat !== 'number' || typeof v.lng !== 'number') return;
      var icon = L.divIcon({
        className: '',
        html: '<div class="pin' + (v.hq ? ' hq' : '') + '"></div>',
        iconSize: [10, 10],
        iconAnchor: [5, 5]
      });
      L.marker([v.lat, v.lng], { icon: icon, title: v.name })
        .bindPopup('<b>' + v.name + '</b><br><span>' + (v.addr || '') + '</span><br><span>' + (v.pours || '') + '</span>')
        .addTo(pins);
      bounds.push([v.lat, v.lng]);
    });

    empty.style.display = bounds.length ? 'none' : 'flex';
    if (bounds.length === 1) map.setView(bounds[0], 14);
    else if (bounds.length > 1) map.fitBounds(bounds, { padding: [46, 46], maxZoom: 13 });
  }

  // The page owns the venue data; we only render what it sends.
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'non:venues') return;
    draw(d.venues);
  });

  window.parent.postMessage({ type: 'non:map-ready' }, '*');
</script>
</body>
</html>
