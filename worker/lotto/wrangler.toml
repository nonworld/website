name = "non-lotto"
main = "src/index.js"
compatibility_date = "2026-07-01"

[vars]
# The prize pool. Odds are weights, not percentages — they are normalised, so
# they do not have to sum to 100. Editable here without touching code; move to
# KV if you want to change them without a deploy.
#
# Checked against the original Scratchie design, 2026-08-04. Six prizes, same
# order, weights identical and summing to 100. Descriptions match the design
# word for word.
#
# ONE DISAGREEMENT, DECIDED. The design names the percentage codes NON15 and
# NON10. This pool says LOTTO15 and LOTTO10, and the evidence says the pool is
# right about what exists: a live checkout returned "LOTTO15 couldn't be used
# with your existing discounts", which is Shopify refusing a COMBINATION — a
# code it does not have would have been refused as invalid.
#
# Aaron's call, 2026-08-04: keep LOTTO15 and LOTTO10. The design table is the
# stale side of this disagreement. Do not "fix" these to match it — renaming
# them would put a code nobody has seen on 38% of all draws, and it would fail
# at the customer's checkout rather than here.
#
# Everything else matches the design exactly: six prizes, same order, weights
# summing to 100, descriptions word for word.
#
# To re-verify the pool against the shop at any time:
#
#   curl '<worker>/health?deep=1&codes=1'
#
# which reports every code's real status and combinesWith. Today it reports
# that it cannot, because this Worker has no SHOPIFY_ADMIN_TOKEN set.
LOTTO_POOL = '''[
  {"code":"LOTTO15","weight":28,"description":"15% off your first case","terms":"Use it at checkout."},
  {"code":"FREESTOPPER","weight":24,"description":"A free NON stopper","terms":"Add a bottle and the stopper is on us."},
  {"code":"FREEPOUR","weight":20,"description":"Complimentary shipping","terms":"Use it at checkout."},
  {"code":"ONEONUS","weight":14,"description":"A bottle of NON, on us","terms":"Add a bottle and the second is on us."},
  {"code":"LOTTO10","weight":10,"description":"10% off","terms":"Use it at checkout."},
  {"code":"THEHOUSE","weight":4,"description":"25% off plus free shipping","terms":"Use it at checkout."}
]'''

SHOPIFY_STORE = "non-world.myshopify.com"

# How a prize code is verified at the moment it is handed out.
#
#   live    — ask the Admin API whether the code is still ACTIVE on every draw.
#             Safest, and the original design. Needs SHOPIFY_ADMIN_TOKEN.
#   trusted — no Shopify call; the pool below is taken as verified.
#
# Set to trusted on 2026-08-03. Shopify stopped allowing new legacy custom apps
# on 1 January 2026, and an existing app's Admin API token cannot be revealed a
# second time — ZAP's was created in September 2023 and is masked for good. The
# only remaining route to a static token is rotating it, which breaks the
# Zapier automations that run off that app.
#
# All six codes were confirmed ACTIVE through the Admin API on the date below.
# To go back to live checking: set this to "live" and put a shpat_ token in
# SHOPIFY_ADMIN_TOKEN. Nothing else changes.
CODE_CHECK = "trusted"
POOL_VERIFIED_AT = "2026-08-03"
KLAVIYO_LIST_ID = "WQLa3T"
KLAVIYO_EVENT = "Scratched NON Lotto"
RATE_LIMIT_PER_HOUR = "6"

# Days before the same email may draw again. 0 = one reveal per email, ever.
# Any other number = a repeat entry is allowed after that many days.
# The two differ only in whether an old ledger entry counts as spent.
#
# Set to 1: a one-day cooldown, not once-ever. LEDGER_TTL in src/index.js is
# sized to match — the ledger only has to outlive the cooldown, and holding
# addresses for 400 days to enforce a 24-hour rule is retention without a
# purpose.
REVEAL_COOLDOWN_DAYS = "1"

# Secrets — set with `npx wrangler secret put <NAME>`, never here:
#   SHOPIFY_ADMIN_TOKEN   Admin API token with read_discounts
#   KLAVIYO_API_KEY       Klaviyo private key
#   TURNSTILE_SECRET      OPTIONAL. Absent = the bot check is skipped entirely.
#                         Present = a missing token is a hard 403, so add the
#                         widget to the frontend BEFORE setting this.

# KV holds the email -> code ledger and the per-IP rate counter.
[[kv_namespaces]]
binding = "LOTTO_KV"
id = "66c6668cea084a2ea4e1c5cbb8be57eb"
