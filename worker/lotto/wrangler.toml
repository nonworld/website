name = "non-lotto"
main = "src/index.js"
compatibility_date = "2026-07-01"

[vars]
# The prize pool. Odds are weights, not percentages — they are normalised, so
# they do not have to sum to 100. Editable here without touching code; move to
# KV if you want to change them without a deploy.
#
# Checked against the original Scratchie design, 2026-08-04. Six prizes, same
# order, weights identical and summing to 100. Descriptions match the design
# word for word.
#
# ONE DISAGREEMENT, DECIDED. The design names the percentage codes NON15 and
# NON10. This pool says LOTTO15 and LOTTO10, and the evidence says the pool is
# right about what exists: a live checkout returned "LOTTO15 couldn't be used
# with your existing discounts", which is Shopify refusing a COMBINATION — a
# code it does not have would have been refused as invalid.
#
# Aaron's call, 2026-08-04: keep LOTTO15 and LOTTO10. The design table is the
# stale side of this disagreement. Do not "fix" these to match it — renaming
# them would put a code nobody has seen on 38% of all draws, and it would fail
# at the customer's checkout rather than here.
#
# Everything else matches the design exactly: six prizes, same order, weights
# summing to 100, descriptions word for word.
#
# To re-verify the pool against the shop at any time:
#
#   curl '<worker>/health?deep=1&codes=1'
#
# which reports every code's real status and combinesWith. Today it reports
# that it cannot, because this Worker has no SHOPIFY_ADMIN_TOKEN set.
LOTTO_POOL = '''[
  {"code":"LOTTO15","weight":28,"description":"15% off your first case","terms":"Use it at checkout."},
  {"code":"FREESTOPPER","weight":24,"description":"A free NON stopper","terms":"Add a bottle and the stopper is on us."},
  {"code":"FREEPOUR","weight":20,"description":"Complimentary shipping","terms":"Use it at checkout."},
  {"code":"ONEONUS","weight":14,"description":"A bottle of NON, on us","terms":"Add a bottle and the second is on us."},
  {"code":"LOTTO10","weight":10,"description":"10% off","terms":"Use it at checkout."},
  {"code":"THEHOUSE","weight":4,"description":"25% off plus free shipping","terms":"Use it at checkout."}
]'''

SHOPIFY_STORE = "non-world.myshopify.com"

# How a prize code is verified at the moment it is handed out.
#
#   live    — ask the Admin API whether the code is still ACTIVE on every draw.
#             Safest, and the original design. Needs SHOPIFY_ADMIN_TOKEN.
#   trusted — no Shopify call; the pool below is taken as verified.
#
# Set to trusted on 2026-08-03. Shopify stopped allowing new legacy custom apps
# on 1 January 2026, and an existing app's Admin API token cannot be revealed a
# second time — ZAP's was created in September 2023 and is masked for good. The
# only remaining route to a static token is rotating it, which breaks the
# Zapier automations that run off that app.
#
# All six codes were confirmed ACTIVE through the Admin API on the date below.
# To go back to live checking: set this to "live" and put a shpat_ token in
# SHOPIFY_ADMIN_TOKEN. Nothing else changes.
CODE_CHECK = "trusted"
POOL_VERIFIED_AT = "2026-08-03"
KLAVIYO_LIST_ID = "WQLa3T"
KLAVIYO_EVENT = "Scratched NON Lotto"
RATE_LIMIT_PER_HOUR = "6"

# Days before the same email may draw again. 0 = one reveal per email, ever.
# Any other number = a repeat entry is allowed after that many days.
# The two differ only in whether an old ledger entry counts as spent.
#
# Set to 1: a one-day cooldown, not once-ever. LEDGER_TTL in src/index.js is
# sized to match — the ledger only has to outlive the cooldown, and holding
# addresses for 400 days to enforce a 24-hour rule is retention without a
# purpose.
REVEAL_COOLDOWN_DAYS = "1"

# Secrets — set with `npx wrangler secret put <NAME>`, never here:
#   SHOPIFY_ADMIN_TOKEN   Admin API token with read_discounts
#   KLAVIYO_API_KEY       Klaviyo private key
#   TURNSTILE_SECRET      OPTIONAL. Absent = the bot check is skipped entirely.
#                         Present = a missing token is a hard 403, so add the
#                         widget to the frontend BEFORE setting this.

# KV holds the email -> code ledger and the per-IP rate counter.
[[kv_namespaces]]
binding = "LOTTO_KV"
id = "66c6668cea084a2ea4e1c5cbb8be57eb"

# ==========================================================================
# US — nonusa.myshopify.com / us.non.world
# ==========================================================================
#
# Deploys as a SECOND Worker, `non-lotto-us`, from this same source:
#
#   npx wrangler deploy --env us
#   npx wrangler secret put KLAVIYO_API_KEY --env us
#
# Run both from `worker/lotto/`. Run them from the repo root and wrangler
# cannot find this file, reports "Required Worker name missing", and the
# --env flag looks like the thing that failed when it was the directory.
#
# EVERY var is repeated below, and that is not redundancy. `vars` and
# `kv_namespaces` are NON-INHERITABLE in wrangler: a named environment does
# not merge with the top-level table, it REPLACES it. Anything omitted here
# is not "the AU value", it is undefined. Delete a line and the US Worker
# loses that setting entirely.
#
# ── Why a separate KV namespace, not a shared one ───────────────────────
# The reveal ledger is keyed on the lowercased email, with no region in the
# key. Share one namespace and an Australian who has already scratched is
# refused in the US, or worse is re-served their AU code — a code that does
# not exist on nonusa and fails at the customer's checkout. Two stores, two
# ledgers.
[env.us]

[env.us.vars]
# Same six prizes, same weights, same words as AU. The codes do not yet
# exist on nonusa: all US discounts today are expired, being DRY JULY 2026
# and ~50 single-use INSTANT_COUPON_* codes. Verified 2026-08-07.
#
# The names stay LOTTO15/LOTTO10 rather than the design's NON15/NON10.
# US is greenfield so either would work, and that is exactly the reason to
# match AU: one pool shape, one set of docs, one story for both regions.
LOTTO_POOL = '''[
  {"code":"LOTTO15","weight":28,"description":"15% off your first case","terms":"Use it at checkout."},
  {"code":"FREESTOPPER","weight":24,"description":"A free NON stopper","terms":"Add a bottle and the stopper is on us."},
  {"code":"FREEPOUR","weight":20,"description":"Complimentary shipping","terms":"Use it at checkout."},
  {"code":"ONEONUS","weight":14,"description":"A bottle of NON, on us","terms":"Add a bottle and the second is on us."},
  {"code":"LOTTO10","weight":10,"description":"10% off","terms":"Use it at checkout."},
  {"code":"THEHOUSE","weight":4,"description":"25% off plus free shipping","terms":"Use it at checkout."}
]'''

SHOPIFY_STORE = "nonusa.myshopify.com"

# live, NOT trusted — the opposite of AU, deliberately.
#
# AU is stuck on "trusted" because its only Admin token was minted in
# September 2023 under the legacy custom-app model and is masked for good;
# rotating it would break the Zapier automations hanging off that app.
#
# nonusa has no such history, and it does NOT need one: there is no shpat_ to
# obtain, because Shopify stopped allowing legacy store custom apps to be
# created on 1 January 2026. A Dev Dashboard app authenticates with the OAuth
# client-credentials grant instead, and src/index.js mints its own 24h token
# from SHOPIFY_CLIENT_ID + SHOPIFY_CLIENT_SECRET, caching it in KV for 23h.
# Do not go looking for a static token for this store. There isn't one.
#
# Until those two secrets are set this Worker is a CLOSED SHOP: missingConfig()
# refuses to draw rather than handing over an unverified code. That is the
# intended state, not a fault to work around by flipping this to "trusted".
CODE_CHECK = "live"
POOL_VERIFIED_AT = ""

# The US Klaviyo account is a DIFFERENT account from AU: public key RCeRnG,
# where AU is U6PhdU. Confirmed 2026-08-07 from the klaviyo.js onsite script
# on us.non.world. So this needs its own list id and its own private key —
# AU's WQLa3T does not exist in this account and writing to it would put
# American sign-ups on an Australian list.
#
# "NON Lotto — scratch card entries", created 2026-08-07 in the NON USA
# account. Sender resolves to the account default, NON USA / gday@non.world.
#
# SINGLE opt-in, and it had to be changed by hand: Klaviyo creates every new
# list as DOUBLE opt-in and labels that "Recommended". Double would have broken
# the mechanic silently — the customer scratches, is shown a prize, and then has
# to go and find a confirmation email before anything arrives. Verified single
# after a full page reload, not just after the click.
#
# The trade-off is real and is the reason this list stays separate: single
# opt-in is a lower-consent audience than the main newsletter. Keep broad
# campaigns on the double opt-in list.
KLAVIYO_LIST_ID = "SFKkfq"
KLAVIYO_EVENT = "Scratched NON Lotto"

RATE_LIMIT_PER_HOUR = "6"
REVEAL_COOLDOWN_DAYS = "1"

# Secrets, per environment. Setting one on `non-lotto` does NOT set it here:
#   npx wrangler secret put SHOPIFY_CLIENT_ID     --env us   Dev Dashboard app client id
#   npx wrangler secret put SHOPIFY_CLIENT_SECRET --env us   its client secret (shpss_)
#   npx wrangler secret put KLAVIYO_API_KEY       --env us   US Klaviyo private key
#
# The app needs read_discounts in its access scopes, and the app and the store
# must sit in the same Dev Dashboard org, or the token exchange answers
# shop_not_permitted rather than anything about discounts.
#
# SHOPIFY_ADMIN_TOKEN is NOT used on this environment. It is read only when it
# holds a legacy shpat_; a shpss_ left in it is ignored, and /health?deep=1
# says so rather than letting it look configured.

# Created 2026-08-07 as "LOTTO_KV_US" on account NON World. The TITLE carries
# the region; the BINDING must stay LOTTO_KV, because src/index.js reads
# env.LOTTO_KV and does not know which store it is serving. Renaming the
# binding to match the title would leave the US Worker with no KV at all —
# and no KV means the ledger and the rate limiter both no-op silently, so one
# email could farm codes all day.
[[env.us.kv_namespaces]]
binding = "LOTTO_KV"
id = "b65fb0aa2e1b4eedac6f71b95c681d31"
