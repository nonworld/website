name = "non-somm"
main = "src/index.js"
compatibility_date = "2026-07-01"

[vars]
# Extraction is a narrow, schema-bound task — the small model is enough and
# it is the call that runs on every keystroke-completed query.
EXTRACT_MODEL = "claude-haiku-4-5-20251001"
# The sentence is customer-facing copy, so it gets the better model.
EXPLAIN_MODEL = "claude-sonnet-5"
RATE_LIMIT_PER_MINUTE = "20"

# The sheet the log is read in. The tab is addressed by gid because that is
# what the URL carries; its NAME is resolved per run, so renaming the tab does
# not silently send rows somewhere else.
#
# These live HERE, under [vars], and that is not a style point. Appended at the
# end of the file they landed inside the [[d1_databases]] table instead —
# TOML keys belong to the last table header above them — and wrangler accepted
# the file, deployed it, and bound neither. No warning, no error, just a Worker
# whose export could never find the sheet. Anything added below the D1 block
# from now on is a D1 property, whatever it looks like.
SHEET_ID = "1MaKIe_a7kgNVPqYQrfktUYzW6p5pt8KNgGMzGK_FnZo"
SHEET_GID = "183822213"

# Retention, in months, matching what the privacy policy states. One number in
# one place: changing the policy and changing the code is a single edit rather
# than two that can quietly disagree. The purge runs on the hourly tick.
RETENTION_MONTHS = "24"

# ANTHROPIC_API_KEY is a secret, never a var:
#   wrangler secret put ANTHROPIC_API_KEY

# Optional. Without it rate limiting is skipped rather than failing closed.
# [[kv_namespaces]]
# binding = "SOMM_KV"
# id = "<namespace id>"

# ---------------------------------------------------------------- capture
#
# Every Somm exchange is written here. Until 2026-08-04 nothing was: the Worker
# answered, streamed, and forgot, so the only record of what customers actually
# ask was whatever happened to be in a `wrangler tail` window at the time. The
# stated goal has always been to see where the Somm is wrong, and that is not
# possible from an empty log.
#
# D1 rather than KV because the point of this data is to be queried — most
# asked, worst rated, which intents fall through — and KV cannot answer any of
# those without reading every key.
#
# NOTHING IDENTIFYING IS STORED. No IP, no email, no customer id, no session
# that could be joined to one. That is not incidental, it is what the privacy
# policy commits to ("we do not link Somm queries to your identity"), and the
# schema is built so that keeping the promise is the default rather than a
# discipline someone has to remember.
[[d1_databases]]
binding = "SOMM_LOG"
database_name = "non-somm-log"
database_id = "42c8b78c-5c21-42ef-9b99-639a954ebe2a"

# Hourly. Frequent enough that the sheet is never meaningfully behind, rare
# enough that a backlog drains in order rather than racing itself.
[triggers]
crons = ["0 * * * *"]

# ==========================================================================
# STAGING — non-somm-staging
# ==========================================================================
#
#   npx wrangler deploy --env staging
#   npx wrangler secret put ANTHROPIC_API_KEY --env staging
#
# Both from `worker/somm/`. From the repo root wrangler cannot find this file
# and reports a missing Worker name, which makes --env look like the failure
# when it was the directory.
#
# WHY THIS EXISTS. Until now there was exactly one Worker, and the storefront's
# published theme pointed at it. That meant a prompt change could not be tried
# without being live for customers: on 2026-08-06 an uncommitted draft went out
# with someone else's deploy, because `wrangler deploy` ships the WORKING TREE
# and nobody had checked git status. The draft was fine. The next one might not
# be, and there was no way to find out first.
#
# EVERY VAR IS REPEATED BELOW, and that is not redundancy. `vars` and
# `d1_databases` are NON-INHERITABLE: a named environment REPLACES the
# top-level table rather than merging with it. Anything omitted here is not
# "the production value", it is undefined.
#
# ── What is deliberately NOT repeated ─────────────────────────────────────
#
# NO D1 BINDING. Staging must never write to `non-somm-log`. That table is the
# record of what real customers ask, and test traffic in it corrupts exactly
# the counts the log exists to produce — the 2026-08-07 review read fallback
# rates and template density straight off it. index.js:1711 returns early when
# SOMM_LOG is unbound, so staging answers normally and simply records nothing.
#
# NO CRON. `crons` is set empty rather than left out: the hourly tick exports
# to the Google Sheet named in SHEET_ID, and a second Worker on the same
# schedule would append staging rows to the same tab. Empty is explicit and
# survives whatever wrangler decides about trigger inheritance.
#
# SHEET_ID/SHEET_GID are carried anyway so the export code paths behave
# identically if one is ever invoked by hand. With no cron nothing calls them.
[env.staging]

[env.staging.vars]
EXTRACT_MODEL = "claude-haiku-4-5-20251001"
EXPLAIN_MODEL = "claude-sonnet-5"
RATE_LIMIT_PER_MINUTE = "20"
SHEET_ID = "1MaKIe_a7kgNVPqYQrfktUYzW6p5pt8KNgGMzGK_FnZo"
SHEET_GID = "183822213"
RETENTION_MONTHS = "24"

# ANTHROPIC_API_KEY is a secret and is NOT set by deploying. Until it is put,
# every call throws before reaching the model and the customer-facing fallback
# answers instead — the Worker looks healthy and says nothing useful. Set it
# before pointing any theme at this endpoint.

[env.staging.triggers]
crons = []
